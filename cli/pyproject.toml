[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peerpedia-cli"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chenqi Meng"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
description = "Edit Markdown locally and submit frozen Peerpedia proposals"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
peerpedia = "peerpedia_cli.main:main"

[tool.setuptools.packages.find]
include = ["peerpedia_cli*"]

[project.urls]
Homepage = "https://peerpedia.dev"
Documentation = "https://peerpedia.dev/help/cli/"
Repository = "https://github.com/peerpedia/peerpedia"
Issues = "https://github.com/peerpedia/peerpedia/issues"

[tool.setuptools.dynamic]
version = {attr = "peerpedia_cli.__version__"}
