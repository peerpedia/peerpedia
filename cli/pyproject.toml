[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerpedia-cli"
version = "0.2.0"
description = "Edit Markdown locally and submit frozen Peerpedia proposals"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
peerpedia = "peerpedia_cli.main:main"

[tool.setuptools.packages.find]
include = ["peerpedia_cli*"]
