{% if google_login_enabled %}
<form action="{% url 'google_login' %}" method="post" class="google-signin-form">
  {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
  <button class="button secondary full" type="submit">{% include 'includes/google_icon.html' %} Continue with Google</button>
</form>
<p class="auth-divider">or</p>
{% endif %}
