{% if google_login_enabled %}
<form action="{% url 'google_login' %}" method="post" class="google-signin-form">
  {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
  <button class="google-signin" type="submit">{% include 'includes/google_icon.html' %}<span>Continue with Google</span></button>
</form>
<div class="auth-divider"><span>or use your password</span></div>
{% endif %}
