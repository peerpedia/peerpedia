{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="?q={{ query|urlencode }}&amp;subject={{ subject|urlencode }}&amp;sort={{ sort }}&amp;tab={{ tab }}&amp;page={{ page.previous_page_number }}">← Previous</a>{% else %}<span></span>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?q={{ query|urlencode }}&amp;subject={{ subject|urlencode }}&amp;sort={{ sort }}&amp;tab={{ tab }}&amp;page={{ page.next_page_number }}">Next →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
