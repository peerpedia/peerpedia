<dialog id="reference-copy-dialog" class="reference-dialog"><form method="dialog"><button class="ui-icon-button" aria-label="Close reference tools" title="Close">{% include "includes/ui_icon.html" with name="close" %}</button></form><h2>Copy reference</h2><p>This link points to the version you are reading.</p>
<label>Permalink<input readonly name="permalink"></label><button type="button" data-copy-field="permalink">{% include "includes/ui_icon.html" with name="copy" %}<span data-copy-label>Copy link</span></button>
<label>Markdown link<input readonly name="markdown"></label><button type="button" data-copy-field="markdown">{% include "includes/ui_icon.html" with name="copy" %}<span data-copy-label>Copy Markdown</span></button>
<label>Within this paper<input readonly name="internal"></label><button type="button" data-copy-field="internal">{% include "includes/ui_icon.html" with name="copy" %}<span data-copy-label>Copy reference</span></button></dialog>
