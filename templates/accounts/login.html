{% extends 'base.html' %}
{% block title %}Sign in · Peerpedia{% endblock %}
{% block content %}
<div class="auth-panel">
  <h1>Sign in</h1>
  {% include 'includes/google_login.html' %}
  <form method="post">
    {% csrf_token %}{% include 'includes/form.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="button full">Sign in</button>
  </form>
  <p class="auth-link"><a href="{% url 'password_reset' %}{% if next %}?next={{ next|urlencode:'' }}{% endif %}">Forgot your password?</a></p>
  <p class="auth-bottom">New to Peerpedia? <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode:'' }}{% endif %}">Create an account</a></p>
</div>
{% endblock %}
