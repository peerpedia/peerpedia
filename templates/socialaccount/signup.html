{% extends 'base.html' %}
{% block title %}Choose a username · Peerpedia{% endblock %}
{% block content %}
<div class="auth-panel">
  <h1>Choose a username</h1>
  <p>This name will appear beside your contributions. Your Google email stays private.</p>
  <form method="post">
    {% csrf_token %}{% include 'includes/form.html' %}
    <button class="button full">Create account</button>
  </form>
</div>
{% endblock %}
