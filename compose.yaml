x-app: &app
  build: .
  image: peerpedia-web:local
  environment: &app-environment
    DEBUG: "0"
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
    DATABASE_URL: postgresql://peerpedia_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-peerpedia}
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Peerpedia <noreply@localhost>}
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peerpedia}
      POSTGRES_USER: ${POSTGRES_USER:-peerpedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-peerpedia.sh:ro
    logging:
      driver: local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    <<: *app
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  migrate:
    <<: *app
    profiles: [maintenance]
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-peerpedia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-peerpedia}
    command: [python, manage.py, migrate, --noinput]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: local
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
