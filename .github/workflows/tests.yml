name: Tests
run-name: ${{ github.event_name == 'schedule' && 'Daily security scan' || 'Tests' }}
on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock --disable-pip --no-deps
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm audit --prefix editor --audit-level=high
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check accounts publishing config cli/peerpedia_cli cli_tests browser_tests scripts plugins/peerpedia/scripts
      - run: python -m ruff format --check accounts publishing config cli/peerpedia_cli cli_tests browser_tests scripts plugins/peerpedia/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --ignore-scripts --prefix editor
      - run: editor/node_modules/.bin/prettier --check 'editor/*.js' 'editor/*.mjs' 'static/*.js'
      - run: for source in static/*.js editor/*.js editor/*.mjs; do node --check "$source"; done
      - run: python -m unittest discover -s scripts -p 'test_*_unit.py'
      - run: python scripts/check_dependencies.py
      - run: python scripts/check_version.py
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - run: python -m build cli --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Install the standalone CLI wheel
        run: |
          python -m venv /tmp/peerpedia-cli-release-check
          /tmp/peerpedia-cli-release-check/bin/python -m pip install --no-deps dist/*.whl
          /tmp/peerpedia-cli-release-check/bin/peerpedia --version
          /tmp/peerpedia-cli-release-check/bin/peerpedia --help
      - name: Record CLI artifact checksums
        run: sha256sum dist/* > "$RUNNER_TEMP/cli-artifact-sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-validation-distributions
          path: dist/
          retention-days: 1
      - uses: actions/download-artifact@v8
        with:
          name: cli-validation-distributions
          path: ${{ runner.temp }}/artifact-check/dist
      - name: Verify downloaded CLI artifacts
        run: |
          cd "$RUNNER_TEMP/artifact-check"
          sha256sum -c "$RUNNER_TEMP/cli-artifact-sha256"
      - run: python scripts/check_plugin.py
      - run: python scripts/test_proxy.py
      - run: docker build --target content-renderer -t peerpedia-renderer:test .
      - run: docker run --rm --network none --read-only --tmpfs /cache:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --memory 768m --memory-swap 768m --pids-limit 64 peerpedia-renderer:test node --test render.test.mjs
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: peerpedia
          POSTGRES_USER: peerpedia
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peerpedia -d peerpedia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://peerpedia:test-only-password@localhost:5432/peerpedia
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install ./cli
      - run: peerpedia --help
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --ignore-scripts --prefix editor
      - run: npm run build --prefix editor
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: peerpedia_browser
          POSTGRES_USER: peerpedia_browser
          POSTGRES_PASSWORD: browser-test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peerpedia_browser -d peerpedia_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROWSER_TEST_DATABASE_URL: postgresql://peerpedia_browser:browser-test-only-password@localhost:5432/peerpedia_browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-browser.txt
      - run: pip install -r requirements.lock -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --ignore-scripts --prefix editor
      - run: npm run build --prefix editor
      - run: python scripts/test_browser.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: .browser-test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
