name: Tests
run-name: ${{ github.event_name == 'schedule' && 'Daily security scan' || 'Tests' }}
on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock --disable-pip --no-deps
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm audit --prefix obsidian --audit-level=high
      - run: npm audit --prefix editor --audit-level=high
      - run: npm audit --prefix packages/peerpedia-theme --audit-level=high
      - run: npm audit --prefix packages/peerpedia-renderer --audit-level=high
  obsidian:
    if: github.event_name != 'schedule'
    # Standard Apple Silicon runner: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            obsidian/package-lock.json
            packages/peerpedia-renderer/package-lock.json
            editor/package-lock.json
            packages/peerpedia-theme/package-lock.json
      - uses: actions/setup-python@v7
        with:
          # pgserver 0.1.4 ships macOS wheels through Python 3.12.
          python-version: "3.12"
      - name: Require the supported package platform
        run: node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'
      - run: npm ci --ignore-scripts --prefix packages/peerpedia-renderer
      - run: npm run prepare:browser --prefix packages/peerpedia-renderer
      - run: npm ci --ignore-scripts --prefix editor
      - run: npm ci --ignore-scripts --prefix packages/peerpedia-theme
      - run: npm ci --prefix obsidian
      - run: npm run typecheck --prefix packages/peerpedia-renderer
      - run: npm run typecheck --prefix obsidian
      - run: npm run check:types --prefix obsidian
      - run: npm run check:community --prefix obsidian
      - run: obsidian/node_modules/.bin/eslint -c obsidian/eslint.config.mjs 'packages/peerpedia-renderer/**/*.ts'
      - name: Verify native component against its source
        run: cd obsidian && node_modules/.bin/tsx scripts/native-files.ts
      - run: npm run build --prefix obsidian
      - run: npm test --prefix obsidian
      - run: pip install -r requirements.lock -r requirements-browser.txt pgserver==0.1.4
      - run: npm run test:django --prefix obsidian
        env:
          PEERPEDIA_TEST_PYTHON: python
          PEERPEDIA_PG_PYTHON: python
      - name: Build the complete offline plugin
        run: npm run package --prefix obsidian -- "$RUNNER_TEMP/peerpedia"
      - uses: actions/upload-artifact@v7
        with:
          name: obsidian-macos-bundle
          path: |
            ${{ runner.temp }}/peerpedia/main.js
            ${{ runner.temp }}/peerpedia/styles.css
      - name: Install the minimum supported Obsidian in temporary storage
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Obsidian.dmg" https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.1/Obsidian-1.15.1.dmg
          echo "e05c7e3e2262b14c965bb246dcb74a30fc9098bd669e42957c4d9f788d04fdf4  $RUNNER_TEMP/Obsidian.dmg" | shasum -a 256 -c -
          hdiutil attach "$RUNNER_TEMP/Obsidian.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/obsidian-volume"
          cp -R "$RUNNER_TEMP/obsidian-volume/Obsidian.app" "$RUNNER_TEMP/Obsidian.app"
          hdiutil detach "$RUNNER_TEMP/obsidian-volume"
      - name: Require real offline host acceptance
        run: python obsidian/scripts/validate-offline-host.py "$RUNNER_TEMP/Obsidian.app" "$RUNNER_TEMP/peerpedia" obsidian/tests/fixtures/render-paper.json "$RUNNER_TEMP/host-evidence"
      - name: Require real publication host acceptance
        run: python obsidian/scripts/validate-publication-host.py "$RUNNER_TEMP/Obsidian.app" "$RUNNER_TEMP/peerpedia" "$RUNNER_TEMP/publication-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: obsidian-validation
          path: |
            ${{ runner.temp }}/host-evidence/
            ${{ runner.temp }}/publication-evidence/
          retention-days: 7
  quality:
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check accounts publishing config cli/peerpedia_cli cli_tests browser_tests scripts plugins/peerpedia/scripts
      - run: python -m ruff format --check accounts publishing config cli/peerpedia_cli cli_tests browser_tests scripts plugins/peerpedia/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/peerpedia-renderer/package-lock.json
            editor/package-lock.json
            packages/peerpedia-theme/package-lock.json
      - run: npm ci --ignore-scripts --prefix packages/peerpedia-theme
      - run: npm ci --ignore-scripts --prefix packages/peerpedia-renderer
      - run: npm run prepare:browser --prefix packages/peerpedia-renderer
      - run: npm ci --ignore-scripts --prefix editor
      - run: npm test --prefix packages/peerpedia-renderer
      - run: npm test --prefix packages/peerpedia-theme
      - run: editor/node_modules/.bin/prettier --check 'editor/*.js' 'editor/*.mjs' 'static/*.js' 'packages/peerpedia-theme/{scripts,tests}/*.mjs' 'packages/peerpedia-renderer/*.{js,mjs,ts,mts}' 'packages/peerpedia-renderer/{browser,tests}/*.{ts,mjs}'
      - run: for source in static/*.js editor/*.js editor/*.mjs; do node --check "$source"; done
      - run: python -m unittest discover -s scripts -p 'test_*_unit.py'
      - run: python scripts/check_dependencies.py
      - run: python scripts/check_version.py
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - run: python -m build cli --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Install the standalone CLI wheel
        run: |
          python -m venv /tmp/peerpedia-cli-release-check
          /tmp/peerpedia-cli-release-check/bin/python -m pip install --no-deps dist/*.whl
          /tmp/peerpedia-cli-release-check/bin/peerpedia --version
          /tmp/peerpedia-cli-release-check/bin/peerpedia --help
      - name: Record CLI artifact checksums
        run: sha256sum dist/* > "$RUNNER_TEMP/cli-artifact-sha256"
      - uses: actions/upload-artifact@v7
        id: cli_artifact
        with:
          name: cli-validation-distributions
          path: dist/
          retention-days: 1
      - name: Retrieve the uploaded CLI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_ARTIFACT_ID: ${{ steps.cli_artifact.outputs.artifact-id }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CLI_ARTIFACT_ID/zip" > "$RUNNER_TEMP/cli-artifact.zip"; then
              break
            fi
            test "$attempt" -lt 5 || exit 1
            sleep 3
          done
          python -m zipfile -e "$RUNNER_TEMP/cli-artifact.zip" "$RUNNER_TEMP/artifact-check/dist"
      - name: Verify downloaded CLI artifacts
        run: |
          cd "$RUNNER_TEMP/artifact-check"
          sha256sum -c "$RUNNER_TEMP/cli-artifact-sha256"
      - run: python scripts/check_plugin.py
      - run: python scripts/test_proxy.py
      - run: docker build --target content-renderer -t peerpedia-renderer:test .
      - run: docker run --rm --network none --read-only --tmpfs /cache:uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges --memory 768m --memory-swap 768m --pids-limit 64 peerpedia-renderer:test node --test render.test.mjs
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: peerpedia
          POSTGRES_USER: peerpedia
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peerpedia -d peerpedia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://peerpedia:test-only-password@localhost:5432/peerpedia
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install ./cli
      - run: peerpedia --help
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/peerpedia-renderer/package-lock.json
            editor/package-lock.json
            packages/peerpedia-theme/package-lock.json
      - run: npm ci --ignore-scripts --prefix packages/peerpedia-theme
      - run: npm ci --ignore-scripts --prefix packages/peerpedia-renderer
      - run: npm run prepare:browser --prefix packages/peerpedia-renderer
      - run: npm ci --ignore-scripts --prefix editor
      - run: npm run build --prefix editor
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: peerpedia_browser
          POSTGRES_USER: peerpedia_browser
          POSTGRES_PASSWORD: browser-test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peerpedia_browser -d peerpedia_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROWSER_TEST_DATABASE_URL: postgresql://peerpedia_browser:browser-test-only-password@localhost:5432/peerpedia_browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-browser.txt
      - run: pip install -r requirements.lock -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/peerpedia-renderer/package-lock.json
            editor/package-lock.json
            packages/peerpedia-theme/package-lock.json
      - run: npm ci --ignore-scripts --prefix packages/peerpedia-theme
      - run: npm ci --ignore-scripts --prefix packages/peerpedia-renderer
      - run: npm run prepare:browser --prefix packages/peerpedia-renderer
      - run: npm ci --ignore-scripts --prefix editor
      - run: npm run build --prefix editor
      - run: python scripts/test_browser.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: .browser-test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  obsidian-linux-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: obsidian-linux-bundle
          path: |
            main.js
            styles.css
  obsidian-reproducibility:
    needs: [obsidian, obsidian-linux-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: obsidian-*-bundle
          path: bundles
      - name: Compare independently built release files
        run: |
          cmp bundles/obsidian-macos-bundle/main.js bundles/obsidian-linux-bundle/main.js
          cmp bundles/obsidian-macos-bundle/styles.css bundles/obsidian-linux-bundle/styles.css
