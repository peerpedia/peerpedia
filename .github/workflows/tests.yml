name: Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check accounts publishing config cli/peerpedia_cli cli_tests browser_tests scripts
      - run: python -m ruff format --check accounts publishing config cli/peerpedia_cli cli_tests browser_tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --ignore-scripts --prefix editor
      - run: editor/node_modules/.bin/prettier --check 'editor/*.js' 'editor/*.mjs' 'static/*.js'
      - run: for source in static/*.js editor/*.js editor/*.mjs; do node --check "$source"; done
      - run: python -m unittest discover -s scripts -p 'test_*_unit.py'
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: peerpedia
          POSTGRES_USER: peerpedia
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peerpedia -d peerpedia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://peerpedia:test-only-password@localhost:5432/peerpedia
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install ./cli
      - run: peerpedia --help
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --ignore-scripts --prefix editor
      - run: npm run build --prefix editor
      - run: python scripts/fetch_mathjax.py
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: peerpedia_browser
          POSTGRES_USER: peerpedia_browser
          POSTGRES_PASSWORD: browser-test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peerpedia_browser -d peerpedia_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROWSER_TEST_DATABASE_URL: postgresql://peerpedia_browser:browser-test-only-password@localhost:5432/peerpedia_browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-browser.txt
      - run: pip install -r requirements.lock -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --ignore-scripts --prefix editor
      - run: npm run build --prefix editor
      - run: python scripts/fetch_mathjax.py
      - run: python scripts/test_browser.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: .browser-test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
