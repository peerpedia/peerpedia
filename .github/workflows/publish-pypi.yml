name: Publish CLI to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag, such as v0.1.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify published release and passing main checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from deploy import verified_release
          version = Path("VERSION").read_text().strip()
          assert os.environ["RELEASE_TAG"] == "v" + version
          release = json.loads(subprocess.check_output([
              "gh", "release", "view", os.environ["RELEASE_TAG"],
              "--json", "isDraft,isPrerelease"
          ]))
          assert not release["isDraft"] and not release["isPrerelease"]
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print(verified_release(sha))
          PY
      - run: python scripts/check_version.py
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - run: python -m build cli --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Check the installed wheel
        run: |
          python -m venv /tmp/peerpedia-cli-check
          /tmp/peerpedia-cli-check/bin/python -m pip install --no-deps dist/*.whl
          /tmp/peerpedia-cli-check/bin/peerpedia --version
          /tmp/peerpedia-cli-check/bin/peerpedia --help
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/peerpedia-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
