# Install as /etc/ssh/sshd_config.d/00-peerpedia-hardening.conf.
# Validate with sshd -t and verify a fresh non-root connection before closing the old one.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60
X11Forwarding no
AllowAgentForwarding no
